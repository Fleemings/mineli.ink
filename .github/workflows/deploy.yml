#
#      - name: Generate Prisma Client
#        run: npx prisma generate --schema apps/backend/prisma/schema.prisma
#
#      - name: Build backend
#        run: npm run build --workspace @mineli-ink/backend
#
#      - name: Test backend
#        run: npm test --workspace @mineli-ink/backend

  # ---------------------------------------------------------
  # Frontend CI
  # ---------------------------------------------------------

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint --workspace @mineli-ink/frontend

      - name: Test frontend
        run: npm test --workspace @mineli-ink/frontend -- --watch=false

      - name: Verify production build
        run: >
          npm run build
          --workspace @mineli-ink/frontend
          --
          --configuration production

  # ---------------------------------------------------------
  # Cloudflare deployment
  # ---------------------------------------------------------

  deploy-frontend:
    if: github.event_name != 'pull_request'

    needs:
      - resolve-environment
      - test-frontend

    runs-on: ubuntu-latest

    environment:
      name: ${{ needs.resolve-environment.outputs.gh_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: >
          npm run build
          --workspace @mineli-ink/frontend
          --
          --configuration
          ${{ needs.resolve-environment.outputs.angular_configuration }}

      - name: Deploy frontend to Cloudflare
        working-directory: apps/frontend

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: ${{ needs.resolve-environment.outputs.cloudflare_environment }}

        run: |
          set -euo pipefail

          if [ "${{ needs.resolve-environment.outputs.environment }}" = "prod" ]; then
            npx --no-install wrangler deploy
          else
            npx --no-install wrangler deploy --env dev
          fi

