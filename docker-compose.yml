version: '3.9'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7-alpine
    container_name: mineli-ink-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mineli_ink
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - mineli-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth

  # Backend Service
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: mineli-ink-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/mineli_ink?authSource=admin
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGO_ROOT_USER:-admin}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGODB_DATABASE: mineli_ink
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mineli-network
    command: npm run dev

  # Frontend Service
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: mineli-ink-frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
      ANGULAR_BACKEND_URL: http://backend:3000/api
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mineli-network
    command: npm start -- --host 0.0.0.0

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  mineli-network:
    driver: bridge

