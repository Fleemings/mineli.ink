services:
  mongodb:
    image: mongo:7
    container_name: mineli-mongodb
    restart: unless-stopped
    environment:
      MONGO_DATABASE: mineli_ink
      MONGO_USERNAME: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth
    deploy:
      resources:
        limits:
          memory: 2g

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mineli-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/mineli_ink?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: mineli-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  mongodb_data: