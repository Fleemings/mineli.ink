# LOCAL / DEV-ONLY STACK: postgres + backend, for running/testing the backend API
#
# To run the frontend locally, use `cd apps/frontend && npm start` (ng serve) instead -
# it talks to this backend at http://localhost:3000/api.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mineli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineli_ink}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mineli_ink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mineli-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mineli_ink}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      BOOKING_FORWARD_TO_EMAIL: ${BOOKING_FORWARD_TO_EMAIL:-}
      FLASH_REQUEST_FORWARD_TO_EMAIL: ${FLASH_REQUEST_FORWARD_TO_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
