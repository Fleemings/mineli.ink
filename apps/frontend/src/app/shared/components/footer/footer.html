<footer class="app-footer">
  <div class="app-footer__inner">
    <p class="app-footer__copyright">{{ 'footer.copyright' | translate: { year: currentYear } }}</p>

    <ul class="app-footer__social">
      <li>
        <a
          class="app-footer__social-link"
          [href]="instagramUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="
            ('footer.social.instagram' | translate) +
            ' (' +
            ('shared.opensInNewTab' | translate) +
            ')'
          "
        >
          <i class="bi bi-instagram app-footer__social-icon" aria-hidden="true"></i>
          <span class="app-footer__social-label">{{ 'footer.social.instagram' | translate }}</span>
        </a>
      </li>
    </ul>
  </div>
</footer>
