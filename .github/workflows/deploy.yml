name: CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------
  # Resolve target environment
  # ---------------------------------------------------------

  resolve-environment:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      gh_environment: ${{ steps.resolve.outputs.gh_environment }}
      angular_configuration: ${{ steps.resolve.outputs.angular_configuration }}
      do_spec_file: ${{ steps.resolve.outputs.do_spec_file }}
      cloudflare_environment: ${{ steps.resolve.outputs.cloudflare_environment }}

    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          if [ "$ENVIRONMENT" = "prod" ]; then
            echo "gh_environment=production" >> "$GITHUB_OUTPUT"
            echo "angular_configuration=production" >> "$GITHUB_OUTPUT"
            echo "do_spec_file=.do/app.prod.yaml" >> "$GITHUB_OUTPUT"
            echo "cloudflare_environment=" >> "$GITHUB_OUTPUT"
          else
            echo "gh_environment=development" >> "$GITHUB_OUTPUT"
            echo "angular_configuration=staging" >> "$GITHUB_OUTPUT"
            echo "do_spec_file=.do/app.dev.yaml" >> "$GITHUB_OUTPUT"
            echo "cloudflare_environment=dev" >> "$GITHUB_OUTPUT"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------
  # Backend CI
  # ---------------------------------------------------------

#  test-backend:
