# Docker Compose para Produção
version: '3.9'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7-alpine
    container_name: mineli-ink-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: mineli_ink
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mineli-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    command: mongod --auth

  # Backend Service
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: mineli-ink-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/mineli_ink?authSource=admin
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USER: ${MONGO_ROOT_USER}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_DATABASE: mineli_ink
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mineli-network
    restart: always

  # Frontend Service
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
    container_name: mineli-ink-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_URL: http://backend:3000/api
    depends_on:
      - backend
    networks:
      - mineli-network
    restart: always

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  mineli-network:
    driver: bridge

