# LOCAL-ONLY: Postgres for running the backend directly on the host (npm run dev)
services:
  postgres:
    image: postgres:16-alpine
    container_name: mineli-backend-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineli_ink}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mineli_ink}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_postgres_data:
