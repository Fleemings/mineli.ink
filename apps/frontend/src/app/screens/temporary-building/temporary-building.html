<div class="temporary-building">
  <div class="temporary-building__language">
    <app-language />
  </div>

  <div class="temporary-building__content">
    <!--
      No Angular interpolation here on purpose: appScrambleTitle (GSAP
      SplitText/ScrambleText) is the sole owner of this element's visual text
      content, driven by the same translated string via its input. aria-label
      gives assistive tech the real translated string directly, which takes
      precedence over the (purely decorative, animated) child text/chars for the
      accessible name.
    -->
    <h1
      class="temporary-building__title"
      [appScrambleTitle]="'temporaryBuilding.title' | translate"
      [attr.aria-label]="'temporaryBuilding.title' | translate"
    ></h1>
    <p class="temporary-building__subtitle">{{ 'temporaryBuilding.subtitle' | translate }}</p>

    <a
      class="temporary-building__social-link"
      [href]="instagramUrl"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="
        ('temporaryBuilding.social.instagram' | translate) +
        ' (' +
        ('shared.opensInNewTab' | translate) +
        ')'
      "
    >
      <i class="bi bi-instagram temporary-building__social-icon" aria-hidden="true"></i>
    </a>
  </div>
</div>
